name: Release

# Tag « vX.Y.Z » : crée une release brouillon, construit le binaire Linux, SpeakerSim.exe
# (Windows) et Speaker Sim.app (macOS, .dmg), vérifie que chaque binaire exporte réellement
# des filtres, envoie les fichiers directement dans la release puis la publie.
# Pas d'« artifacts » Actions : les fichiers de release ne comptent pas dans le quota.
# Lancement manuel : construction + tests de fumée uniquement (rien n'est publié).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Release brouillon
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
                 --title "Speaker Sim $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" install.sh --clobber

  build:
    needs: prepare
    if: ${{ !cancelled() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc 2.35 : le binaire fonctionne aussi sur les distributions plus anciennes.
          - os: ubuntu-22.04
            asset: SpeakerSim-Linux-x64
          - os: windows-latest
            asset: SpeakerSim-Windows-x64.exe
          - os: macos-latest
            asset: SpeakerSim-macOS-AppleSilicon.dmg
          - os: macos-15-intel
            asset: SpeakerSim-macOS-Intel.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: speaker-sim
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: speaker-sim
      - name: Version depuis le tag
        if: env.IS_TAG == 'true'
        run: |
          v="${GITHUB_REF_NAME#v}"
          sed -i.bak "s/^version = .*/version = \"$v\"/" Cargo.toml && rm Cargo.toml.bak
          cargo update --workspace
      - name: Compilation
        run: cargo build --release --bin speaker-sim
      - name: Version du binaire
        if: runner.os != 'Windows'
        run: target/release/speaker-sim --version

      - name: Test de fumée (Linux)
        if: runner.os == 'Linux'
        run: |
          target/release/speaker-sim --export "$RUNNER_TEMP/export"
          for f in ir_LL.wav speaker-sim.txt speaker-sim-true-stereo.wav; do test -f "$RUNNER_TEMP/export/$f"; done
          mkdir -p dist && cp target/release/speaker-sim "dist/${{ matrix.asset }}"

      - name: Test de fumée (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "export"
          $p = Start-Process -FilePath target\release\speaker-sim.exe -ArgumentList "--export", "`"$out`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "code de sortie $($p.ExitCode)" }
          foreach ($f in "ir_LL.wav", "speaker-sim.txt", "speaker-sim-true-stereo.wav") {
            if (-not (Test-Path (Join-Path $out $f))) { throw "$f manquant" }
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\speaker-sim.exe "dist\${{ matrix.asset }}"

      - name: Paquet .app + test de fumée + DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          v="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)"
          app="dist/Speaker Sim.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" icon.iconset
          cp target/release/speaker-sim "$app/Contents/MacOS/Speaker Sim"
          for s in 16 32 128 256 512; do
            sips -z $s $s packaging/icon.png --out "icon.iconset/icon_${s}x${s}.png" >/dev/null
            sips -z $((s * 2)) $((s * 2)) packaging/icon.png --out "icon.iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns icon.iconset -o "$app/Contents/Resources/icon.icns"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Speaker Sim</string>
            <key>CFBundleDisplayName</key><string>Speaker Sim</string>
            <key>CFBundleExecutable</key><string>Speaker Sim</string>
            <key>CFBundleIdentifier</key><string>io.github.devfrp.speakersim</string>
            <key>CFBundleIconFile</key><string>icon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$v</string>
            <key>CFBundleVersion</key><string>$v</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSHumanReadableCopyright</key><string>© 2026 devfrp — MIT</string>
          </dict>
          </plist>
          EOF
          "$app/Contents/MacOS/Speaker Sim" --export "$RUNNER_TEMP/export"
          for f in ir_LL.wav speaker-sim.txt speaker-sim-true-stereo.wav; do test -f "$RUNNER_TEMP/export/$f"; done
          codesign --force --deep --sign - "$app"
          mkdir dmg && cp -R "$app" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Speaker Sim" -srcfolder dmg -ov -format UDZO "dist/${{ matrix.asset }}"

      - name: Envoi dans la release
        if: env.IS_TAG == 'true'
        run: gh release upload "$GITHUB_REF_NAME" "dist/${{ matrix.asset }}" --clobber

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Sommes SHA-256 et publication
        run: |
          mkdir assets
          gh release download "$GITHUB_REF_NAME" --dir assets
          (cd assets && sha256sum -- * > ../SHA256SUMS.txt)
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
