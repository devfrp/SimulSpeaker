name: Release

# Tag « vX.Y.Z » : crée une release brouillon, construit SpeakerSim.exe (Windows) et
# Speaker Sim.app (macOS, .dmg), vérifie que chaque binaire exporte réellement des
# filtres, envoie les fichiers directement dans la release puis la publie.
# Pas d'« artifacts » Actions : les fichiers de release ne comptent pas dans le quota.
# Lancement manuel : construction + tests de fumée uniquement (rien n'est publié).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  prepare:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Release brouillon
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
                 --title "Speaker Sim $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" install.sh --clobber

  build:
    needs: prepare
    if: ${{ !cancelled() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: SpeakerSim-Windows-x64.exe
          - os: macos-latest
            asset: SpeakerSim-macOS-AppleSilicon.dmg
          - os: macos-15-intel
            asset: SpeakerSim-macOS-Intel.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: speaker-sim
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Dépendances
        run: pip install pyinstaller pillow PyQt6 numpy scipy requests h5py
      - name: Version depuis le tag
        if: env.IS_TAG == 'true'
        run: |
          v="${GITHUB_REF_NAME#v}"
          sed -i.bak "s/^APP_VERSION = .*/APP_VERSION = \"$v\"/" config.py
          sed -i.bak "s/\"CFBundleShortVersionString\": \"[^\"]*\"/\"CFBundleShortVersionString\": \"$v\"/" packaging/speaker-sim.spec
      - name: PyInstaller
        run: pyinstaller --noconfirm packaging/speaker-sim.spec

      - name: Test de fumée (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "export"
          $p = Start-Process -FilePath dist\SpeakerSim.exe -ArgumentList "--export", "`"$out`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "code de sortie $($p.ExitCode)" }
          foreach ($f in "ir_LL.wav", "speaker-sim.txt", "speaker-sim-true-stereo.wav") {
            if (-not (Test-Path (Join-Path $out $f))) { throw "$f manquant" }
          }
          Move-Item dist\SpeakerSim.exe "dist\${{ matrix.asset }}"

      - name: Test de fumée + DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          "dist/Speaker Sim.app/Contents/MacOS/Speaker Sim" --export "$RUNNER_TEMP/export"
          for f in ir_LL.wav speaker-sim.txt speaker-sim-true-stereo.wav; do test -f "$RUNNER_TEMP/export/$f"; done
          codesign --force --deep --sign - "dist/Speaker Sim.app"
          mkdir dmg && cp -R "dist/Speaker Sim.app" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Speaker Sim" -srcfolder dmg -ov -format UDZO "dist/${{ matrix.asset }}"

      - name: Envoi dans la release
        if: env.IS_TAG == 'true'
        run: gh release upload "$GITHUB_REF_NAME" "dist/${{ matrix.asset }}" --clobber

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Sommes SHA-256 et publication
        run: |
          mkdir assets
          gh release download "$GITHUB_REF_NAME" --dir assets
          (cd assets && sha256sum -- * > ../SHA256SUMS.txt)
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
