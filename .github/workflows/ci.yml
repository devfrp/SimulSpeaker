name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: speaker-sim
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: speaker-sim
      - name: KEMAR système (test du lecteur SOFA)
        run: sudo apt-get update -q && sudo apt-get install -yq libmysofa1 shellcheck
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: "Tests (sans réseau, PipeWire ni systemd, tous simulés)"
        run: cargo test --workspace --locked
      - name: Sans interface graphique
        run: cargo check --no-default-features --locked
      - name: ShellCheck (install.sh)
        working-directory: .
        run: shellcheck install.sh
